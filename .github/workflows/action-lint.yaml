name: Action Lint

on:
  workflow_call:
    inputs:
      runs-on:
        description: >-
          Runner label. Defaults to ubuntu-latest. Override to a self-hosted
          runner label if you want to run CI on your own scale set; pair with
          runner-labels so actionlint accepts the label.
        required: false
        default: ubuntu-latest
        type: string
      go-version:
        description: Go version used to install actionlint
        required: false
        default: "1.25.0"
        type: string
      actionlint-version:
        description: actionlint version to install
        required: false
        default: v1.7.12
        type: string
      runner-labels:
        description: >-
          Comma- or newline-separated list of self-hosted runner label names
          (e.g. "fast-runner,gpu-runner"). When set, the workflow writes a
          temporary .github/actionlint.yaml registering these labels so
          actionlint doesn't flag `runs-on: <label>` as unknown. Ignored if
          the calling repo already commits a .github/actionlint.yaml. Leave
          empty (default) if you only use GitHub-hosted runners or ship your
          own actionlint config.
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  action-lint:
    name: actionlint
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          cache: false
          go-version: ${{ inputs.go-version }}

      - name: Install actionlint
        shell: bash
        run: |
          GOBIN="$RUNNER_TEMP/bin" go install github.com/rhysd/actionlint/cmd/actionlint@${{ inputs.actionlint-version }}
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # Register self-hosted runner labels with actionlint when the caller
      # passes them as input. Skipped if the calling repo already ships its
      # own .github/actionlint.yaml — that takes precedence.
      - name: Register runner labels
        if: inputs.runner-labels != ''
        shell: bash
        env:
          LABELS: ${{ inputs.runner-labels }}
        run: |
          if [ -f .github/actionlint.yaml ] || [ -f .github/actionlint.yml ]; then
            echo "Calling repo provides its own .github/actionlint.yaml — leaving untouched"
            exit 0
          fi
          mkdir -p .github
          {
            echo "self-hosted-runner:"
            echo "  labels:"
            echo "${LABELS}" | tr ',' '\n' | while IFS= read -r label; do
              label="$(echo "${label}" | tr -d '[:space:]')"
              [ -n "${label}" ] && echo "    - ${label}"
            done
          } > .github/actionlint.yaml
          echo "Wrote .github/actionlint.yaml from runner-labels input:"
          cat .github/actionlint.yaml

      - name: Run actionlint
        id: actionlint
        run: actionlint

      - name: actionlint summary
        if: always()
        run: |
          if [ "${{ steps.actionlint.outcome }}" = "success" ]; then
            {
              echo "### actionlint"
              echo "actionlint passed."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### actionlint"
              echo "actionlint failed."
              echo ""
              echo "- Review the job logs for details."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
