name: Action Lint

on:
  workflow_call:
    inputs:
      runs-on:
        description: >-
          Runner label. Default ubuntu-latest keeps the workflow public/external-safe.
          Internal callers can pass kupe-small | kupe-medium | kupe-large to target
          the self-hosted runner scale sets from the kupe/github-runners chart.
        required: false
        default: ubuntu-latest
        type: string
      go-version:
        description: Go version used to install actionlint
        required: false
        default: "1.25.0"
        type: string
      actionlint-version:
        description: actionlint version to install
        required: false
        default: v1.7.12
        type: string

permissions:
  contents: read

jobs:
  action-lint:
    name: actionlint
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          cache: false
          go-version: ${{ inputs.go-version }}

      - name: Install actionlint
        shell: bash
        run: |
          GOBIN="$RUNNER_TEMP/bin" go install github.com/rhysd/actionlint/cmd/actionlint@${{ inputs.actionlint-version }}
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # Inject default config declaring the kupe-* self-hosted runner labels
      # provisioned by kupe/github-runners, so consumers using those runners
      # don't each need their own .github/actionlint.yaml. Consumers may
      # override by committing their own .github/actionlint.yaml (e.g. to add
      # extra custom labels) — we only write the default when missing.
      - name: Inject default actionlint config
        shell: bash
        run: |
          if [ -f .github/actionlint.yaml ] || [ -f .github/actionlint.yml ]; then
            echo "Consumer repo provides its own .github/actionlint.yaml — leaving untouched"
            exit 0
          fi
          mkdir -p .github
          cat > .github/actionlint.yaml <<'EOF'
          self-hosted-runner:
            # kupe-* runners are provisioned by the kupe/github-runners chart.
            labels:
              - kupe-small
              - kupe-medium
              - kupe-large
          EOF
          echo "Wrote default .github/actionlint.yaml with kupe-* runner labels"

      - name: Run actionlint
        id: actionlint
        run: actionlint

      - name: actionlint summary
        if: always()
        run: |
          if [ "${{ steps.actionlint.outcome }}" = "success" ]; then
            {
              echo "### actionlint"
              echo "actionlint passed."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### actionlint"
              echo "actionlint failed."
              echo ""
              echo "- Review the job logs for details."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
