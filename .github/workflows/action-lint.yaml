name: Action Lint

on:
  workflow_call:
    inputs:
      runs-on:
        description: >-
          Runner label. Defaults to ubuntu-latest. Override to a self-hosted
          runner label if you want to run CI on your own scale set. To
          register custom self-hosted runner labels with actionlint, commit
          a .github/actionlint.yaml file in the calling repo — see
          https://github.com/rhysd/actionlint/blob/main/docs/config.md.
        required: false
        default: ubuntu-latest
        type: string
      go-version:
        description: Go version used to install actionlint
        required: false
        default: "1.25.0"
        type: string
      actionlint-version:
        description: actionlint version to install
        required: false
        default: v1.7.12
        type: string

permissions:
  contents: read

jobs:
  action-lint:
    name: actionlint
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          cache: false
          go-version: ${{ inputs.go-version }}

      - name: Install actionlint
        shell: bash
        run: |
          GOBIN="$RUNNER_TEMP/bin" go install github.com/rhysd/actionlint/cmd/actionlint@${{ inputs.actionlint-version }}
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Run actionlint
        id: actionlint
        run: actionlint

      - name: actionlint summary
        if: always()
        run: |
          if [ "${{ steps.actionlint.outcome }}" = "success" ]; then
            {
              echo "### actionlint"
              echo "actionlint passed."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### actionlint"
              echo "actionlint failed."
              echo ""
              echo "- Review the job logs for details."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
