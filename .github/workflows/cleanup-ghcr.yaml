name: Cleanup GHCR Untagged

# Deletes untagged GHCR package versions older than a retention window.
#
# Tags in a container registry are mutable pointers to immutable manifests.
# Each push of the same tag (e.g. :dev, :main) leaves the previous manifest
# behind as an untagged version that accumulates indefinitely. This workflow
# prunes those orphans while leaving every tagged version untouched.
#
# The GITHUB_TOKEN used here must have `packages: write` on the package's
# owning repository — declare that at the caller job level.

on:
  workflow_call:
    inputs:
      runs-on:
        description: >-
          Runner label. Defaults to ubuntu-latest. Override to a self-hosted
          runner label if you want to run CI on your own scale set.
        required: false
        default: ubuntu-latest
        type: string
      package_name:
        description: GHCR package name under the owner (defaults to the repository name).
        required: false
        type: string
        default: ""
      retention_days:
        description: Keep untagged versions updated within this many days.
        required: false
        type: number
        default: 7
      owner_type:
        description: Package owner type — "orgs" or "users".
        required: false
        type: string
        default: orgs
      dry_run:
        description: Log candidates without deleting anything.
        required: false
        type: boolean
        default: false

permissions:
  packages: write

jobs:
  cleanup:
    name: Delete untagged versions older than retention window
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: Prune untagged GHCR versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          OWNER_TYPE: ${{ inputs.owner_type }}
          REPO_NAME: ${{ github.event.repository.name }}
          PACKAGE_INPUT: ${{ inputs.package_name }}
          RETENTION_DAYS: ${{ inputs.retention_days }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          package="${PACKAGE_INPUT:-$REPO_NAME}"
          # GHCR package names may contain slashes (nested images); encode them for API paths.
          package_enc=${package//\//%2F}

          cutoff_epoch=$(date -u -d "${RETENTION_DAYS} days ago" +%s)
          echo "Owner:          ${OWNER_TYPE}/${OWNER}"
          echo "Package:        ${package}"
          echo "Retention days: ${RETENTION_DAYS}"
          echo "Cutoff (UTC):   $(date -u -d "@${cutoff_epoch}" -Iseconds)"
          echo "Dry run:        ${DRY_RUN}"
          echo

          kept_tagged=0
          kept_recent=0
          kept_referenced=0
          deleted=0
          would_delete=0
          fetch_failed=0

          # ---- Pass 1: collect digests referenced by any TAGGED manifest ----
          # A multi-arch image tags ONLY its index; the per-architecture child
          # manifests and the buildkit attestation manifests are UNTAGGED yet are
          # referenced by that tagged index. Treating them as deletable orphans
          # (tag_count == 0) and pruning them silently breaks the tagged image —
          # `docker pull <tag>` then fails with "manifest <child> not found". So
          # first build the set of child digests referenced by every tagged
          # version; those are never deleted, regardless of age.
          reg_bearer=$(printf '%s' "${GH_TOKEN}" | base64 | tr -d '\n')
          registry_path=$(printf '%s/%s' "${OWNER}" "${package}" | tr '[:upper:]' '[:lower:]')
          declare -A referenced=()

          page=1
          while :; do
            response=$(gh api \
              -H "Accept: application/vnd.github+json" \
              "/${OWNER_TYPE}/${OWNER}/packages/container/${package_enc}/versions?per_page=100&page=${page}")
            [ "$(echo "$response" | jq 'length')" -eq 0 ] && break

            while IFS=$'\t' read -r digest tag_count; do
              [ "$tag_count" -gt 0 ] || continue
              # Fail CLOSED on fetch errors: swallowing a transient failure
              # here would drop this tagged index's children from the
              # protection set, and pass 2 would delete them — exactly the
              # broken-tagged-pull incident described above. Any failure
              # flags the run so the delete phase is skipped (report-only).
              curl_status=0
              manifest=$(curl -fsSL \
                -H "Authorization: Bearer ${reg_bearer}" \
                -H "Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json" \
                "https://ghcr.io/v2/${registry_path}/manifests/${digest}") || curl_status=$?
              if [ "$curl_status" -ne 0 ]; then
                echo "::error::Manifest fetch failed for tagged digest ${digest} (curl exit ${curl_status})"
                fetch_failed=1
                continue
              fi
              # A single-arch manifest legitimately has no .manifests list —
              # that yields empty output with exit 0. Only a parse failure
              # (non-JSON response) is an error.
              if ! children=$(jq -r 'if .manifests then .manifests[].digest else empty end' <<< "$manifest"); then
                echo "::error::Manifest parse failed for tagged digest ${digest}"
                fetch_failed=1
                continue
              fi
              for child in $children; do
                referenced["$child"]=1
              done
            done < <(echo "$response" | jq -r '.[] | [.name, (.metadata.container.tags | length)] | @tsv')

            page=$((page + 1))
          done
          echo "Referenced child manifests (multi-arch + attestations, always kept): ${#referenced[@]}"
          echo

          if [ "$fetch_failed" -ne 0 ]; then
            echo "::error::One or more tagged-manifest fetches failed; the referenced set may be incomplete. Failing closed: skipping all deletions this run (report-only)."
            DRY_RUN="true"
          fi

          # ---- Pass 2: delete untagged versions that are old AND unreferenced ----
          # Enumerate ALL versions across every page FIRST, classify them, then
          # delete. Deleting while paginating forward is a correctness bug on
          # GitHub's offset pagination: each DELETE shifts the remaining
          # versions left, so after removing N items from page P the first N
          # items of the next window are skipped unexamined — a fraction of
          # prunable versions survives every run. Separating enumeration from
          # mutation makes the page walk stable regardless of what we delete.
          delete_ids=()
          page=1
          while :; do
            response=$(gh api \
              -H "Accept: application/vnd.github+json" \
              "/${OWNER_TYPE}/${OWNER}/packages/container/${package_enc}/versions?per_page=100&page=${page}")

            count=$(echo "$response" | jq 'length')
            if [ "$count" -eq 0 ]; then
              break
            fi

            while IFS=$'\t' read -r id digest updated_at tag_count; do
              if [ "$tag_count" -gt 0 ]; then
                kept_tagged=$((kept_tagged + 1))
                continue
              fi

              # Never delete a manifest referenced by a tagged index (multi-arch
              # child or attestation) — that is exactly what broke tagged pulls.
              if [ -n "${referenced[$digest]:-}" ]; then
                kept_referenced=$((kept_referenced + 1))
                continue
              fi

              updated_epoch=$(date -u -d "$updated_at" +%s)
              if [ "$updated_epoch" -gt "$cutoff_epoch" ]; then
                kept_recent=$((kept_recent + 1))
                continue
              fi

              if [ "$DRY_RUN" = "true" ]; then
                echo "DRY RUN: would delete version ${id} (${digest}, updated ${updated_at})"
                would_delete=$((would_delete + 1))
              else
                echo "Marking version ${id} for deletion (${digest}, updated ${updated_at})"
                delete_ids+=("$id")
              fi
            done < <(echo "$response" | jq -r '.[] | [.id, .name, .updated_at, (.metadata.container.tags | length)] | @tsv')

            page=$((page + 1))
          done

          # Mutation phase: enumeration is complete, so deletions can no longer
          # perturb the page walk above.
          for id in "${delete_ids[@]:-}"; do
            [ -n "$id" ] || continue
            echo "Deleting version ${id}"
            gh api --method DELETE \
              "/${OWNER_TYPE}/${OWNER}/packages/container/${package_enc}/versions/${id}"
            deleted=$((deleted + 1))
          done

          echo
          echo "Summary:"
          echo "  kept (tagged):     ${kept_tagged}"
          echo "  kept (referenced): ${kept_referenced}"
          echo "  kept (recent):     ${kept_recent}"
          if [ "$DRY_RUN" = "true" ]; then
            echo "  would delete:   ${would_delete}"
          else
            echo "  deleted:        ${deleted}"
          fi

          {
            echo "### GHCR cleanup: ${package}"
            echo ""
            echo "| metric | count |"
            echo "| --- | ---: |"
            echo "| kept (tagged) | ${kept_tagged} |"
            echo "| kept (referenced by tagged index) | ${kept_referenced} |"
            echo "| kept (recent, < ${RETENTION_DAYS}d) | ${kept_recent} |"
            if [ "$DRY_RUN" = "true" ]; then
              echo "| would delete | ${would_delete} |"
            else
              echo "| deleted | ${deleted} |"
            fi
            if [ "$fetch_failed" -ne 0 ]; then
              echo ""
              echo "> **Failed closed:** tagged-manifest fetch errors — deletions were skipped this run."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          # Surface the fail-closed condition as a job failure so a
          # persistently broken protection pass cannot go unnoticed while
          # every run silently degrades to report-only.
          if [ "$fetch_failed" -ne 0 ]; then
            exit 1
          fi
