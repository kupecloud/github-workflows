name: Detect Changes

# Reusable change-detection. Callers list one or more repository paths and
# get back a single boolean indicating whether any of them changed between
# the triggering event's base and head commits. Works for pull_request and
# push events.
#
# For independent signals (e.g. "packer changed" AND "docs changed" as
# separate gates), call this workflow twice with different `paths`. Each
# call emits its own `changed` output. For a single OR-across-paths gate,
# list everything in one call.

on:
  workflow_call:
    inputs:
      runs-on:
        description: >-
          Runner label. Defaults to ubuntu-latest. Override to a self-hosted
          runner label if you want to run CI on your own scale set.
        required: false
        default: ubuntu-latest
        type: string
      paths:
        description: |
          Newline-separated list of git pathspecs to watch. Each entry can
          be a directory ("packer/"), a single file ("Dockerfile"), or a
          glob ("*.tf"). Output is "true" if any tracked file under any
          listed path changed between the event's base and head commits.

          Example:
            paths: |
              packer/
              docs/
              README.md
        required: true
        type: string
    outputs:
      changed:
        description: '"true" if any listed path changed, else "false".'
        value: ${{ jobs.detect.outputs.changed }}

permissions:
  contents: read

jobs:
  detect:
    name: Detect
    runs-on: ${{ inputs.runs-on }}
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # Full history needed so `git diff BASE HEAD` can resolve both
          # ends regardless of how shallow the trigger's default fetch is.
          fetch-depth: 0

      - id: diff
        env:
          PATHS: ${{ inputs.paths }}
          # Covers both trigger shapes: pull_request exposes base/head on
          # the PR object; push exposes `before` (parent) on the event and
          # `github.sha` as the new tip.
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          if [ -z "${BASE_SHA:-}" ] || [ -z "${HEAD_SHA:-}" ]; then
            echo "Unable to resolve BASE_SHA or HEAD_SHA from event context;" >&2
            echo "event=${GITHUB_EVENT_NAME}, base='${BASE_SHA:-}', head='${HEAD_SHA:-}'" >&2
            exit 1
          fi

          # Fail SAFE to changed=true when the base commit can't be diffed
          # against. On a branch-creation push `github.event.before` is the
          # all-zeros SHA; on a force push the old `before` commit may no
          # longer be reachable from any ref (fetch-depth 0 won't have it).
          # Either way `git diff <base> HEAD` would error and fail every gated
          # caller job. Running CI unnecessarily is the cheap failure mode, so
          # treat an unresolvable base as "everything changed".
          zero_sha="0000000000000000000000000000000000000000"
          if [ "$BASE_SHA" = "$zero_sha" ] || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "Base commit '${BASE_SHA}' is the zero SHA or not reachable" >&2
            echo "(branch creation / force push); failing safe to changed=true." >&2
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Turn the newline-separated paths input into positional args
          # for git diff. Blank lines are dropped so trailing newlines in
          # YAML block scalars don't produce a stray empty pathspec.
          mapfile -t args < <(printf '%s\n' "$PATHS" | sed '/^[[:space:]]*$/d')

          if [ "${#args[@]}" -eq 0 ]; then
            echo "Input 'paths' is empty; nothing to match." >&2
            exit 1
          fi

          # For pull_request, diff against the merge-base so commits that
          # landed on the base branch after this PR forked don't register as
          # changes here (a plain two-dot `git diff BASE HEAD` compares against
          # the moving base-branch tip). For push there is no useful merge-base,
          # so keep the two-dot diff against the event's `before` commit.
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            DIFF_BASE="$BASE_SHA"
          elif ! DIFF_BASE="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"; then
            echo "No merge-base between '${BASE_SHA}' and '${HEAD_SHA}';" >&2
            echo "failing safe to changed=true." >&2
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --name-only "$DIFF_BASE" "$HEAD_SHA" -- "${args[@]}" | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
