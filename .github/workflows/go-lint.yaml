name: Go Lint

on:
  workflow_call:
    inputs:
      runs-on:
        description: >-
          Runner label. Defaults to ubuntu-latest. Override to a self-hosted
          runner label if you want to run CI on your own scale set.
        required: false
        default: ubuntu-latest
        type: string
      go-version-file:
        description: Path to the Go version file
        required: false
        default: go.mod
        type: string
      vendor:
        description: Run go mod vendor before linting
        required: false
        default: false
        type: boolean
      golangci-args:
        description: Arguments passed to golangci-lint
        required: false
        default: --timeout=10m
        type: string
      golangci-version:
        description: golangci-lint version to install
        required: false
        default: v2.1.6
        type: string

permissions:
  contents: read

jobs:
  golangci-lint:
    name: golangci-lint
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: ${{ inputs.go-version-file }}
          cache: true

      - name: Ensure vendor directory
        if: inputs.vendor
        run: go mod vendor

      - name: Apply default golangci config
        shell: bash
        env:
          # job_workflow_sha is only a context property, NOT a default env var
          # (GITHUB_JOB_WORKFLOW_SHA does not exist), so it must be injected here
          # for the script to pin the shared config to this reusable workflow's
          # commit instead of always falling back to mutable `main`.
          JOB_WORKFLOW_SHA: ${{ github.job_workflow_sha }}
        run: |
          if [ ! -f .golangci.yaml ] && [ ! -f .golangci.yml ] && [ ! -f .golangci.json ] && [ ! -f .golangci.toml ]; then
            VERSION="${{ inputs.golangci-version }}"
            if [[ "$VERSION" != v2.* ]]; then
              echo "No default config available for golangci-lint v1 — using built-in defaults"
              exit 0
            fi
            # Pin the shared default config to the exact commit of *this*
            # reusable workflow rather than the mutable `main` branch, so the
            # lint config is immutable and matches the SHA the consumer pinned
            # its `uses:` to. JOB_WORKFLOW_SHA is injected from
            # github.job_workflow_sha (see the step `env:` above) — the commit
            # SHA of the reusable workflow file that defines this job.
            # github.workflow_sha must NOT be used here — in a reusable workflow
            # the github context is the *caller's*, so it holds the consumer
            # repo's commit, which does not exist under kupecloud/github-workflows
            # and would 404. Falls back to main only if unset.
            CONFIG_REF="${JOB_WORKFLOW_SHA:-main}"
            CONFIG_URL="https://raw.githubusercontent.com/kupecloud/github-workflows/${CONFIG_REF}/golangci-default.yaml"
            echo "No local golangci config found — downloading shared default from ${CONFIG_REF}"
            curl -sSfL "$CONFIG_URL" -o .golangci.yaml
          else
            echo "Using repo-local golangci config"
          fi

      - name: Install golangci-lint
        shell: bash
        run: |
          VERSION="${{ inputs.golangci-version }}"
          if [[ "$VERSION" == v2.* ]]; then
            MODULE="github.com/golangci/golangci-lint/v2/cmd/golangci-lint"
          else
            MODULE="github.com/golangci/golangci-lint/cmd/golangci-lint"
          fi
          GOBIN="$RUNNER_TEMP/bin" go install "${MODULE}@${VERSION}"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Run golangci-lint
        id: golangci
        run: golangci-lint run ${{ inputs.golangci-args }}

      - name: golangci-lint summary
        if: always()
        run: |
          if [ "${{ steps.golangci.outcome }}" = "success" ]; then
            {
              echo "Go linting passed."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "Go linting failed."
              echo ""
              echo "- Review the job logs for full details."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  # Catch a Dockerfile builder image that has drifted BEHIND the go.mod `go`
  # directive. Our builder images set GOTOOLCHAIN=local, so an older builder
  # hard-fails with:
  #   go: go.mod requires go >= 1.26.5 (running 1.26.3; GOTOOLCHAIN=local)
  #
  # This drift is silent and expensive: `publish-image` only runs on a release,
  # so a go.mod bump (typically for a CVE) breaks image publishing weeks before
  # anyone notices. It cost kupe-api every image publish from v1.4.0 onward —
  # the tag existed, the image never did — and hit console-connect and
  # hello-kupe the same way. Running it here, on every push, fails at the
  # commit that introduces the drift instead of at the next release.
  #
  # No-ops for repos without a Dockerfile, without a `golang:` builder, or
  # where the version can't be parsed — this must never block a repo it
  # doesn't apply to.
  go-version-drift:
    name: go version drift
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dockerfile builder >= go.mod
        run: |
          if [ ! -f Dockerfile ] || [ ! -f go.mod ]; then
            echo "No Dockerfile or go.mod — nothing to check."
            exit 0
          fi

          gomod=$(grep -oE '^go [0-9]+(\.[0-9]+)*' go.mod | head -1 | awk '{print $2}')
          builder=$(grep -oE 'golang:[0-9]+(\.[0-9]+)*' Dockerfile | head -1 | cut -d: -f2)

          if [ -z "$gomod" ] || [ -z "$builder" ]; then
            echo "Could not parse versions (go.mod='$gomod' builder='$builder') — skipping."
            exit 0
          fi

          # sort -V puts the lower version first. The builder is acceptable when
          # it is >= go.mod, i.e. when go.mod is the lower of the two (equal
          # versions also land go.mod first, which is fine).
          lower=$(printf '%s\n%s\n' "$gomod" "$builder" | sort -V | head -1)
          if [ "$lower" != "$gomod" ]; then
            echo "::error file=Dockerfile::Builder image golang:$builder is OLDER than the go.mod directive (go $gomod). Because the builder sets GOTOOLCHAIN=local, the image build will fail with 'go.mod requires go >= $gomod'. Bump the Dockerfile FROM tag (and its digest, if pinned) to >= $gomod."
            exit 1
          fi

          echo "OK: builder golang:$builder >= go.mod go $gomod"

  go-fmt:
    name: gofmt
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: ${{ inputs.go-version-file }}
          cache: true

      - name: Check formatting
        id: gofmt
        run: |
          find . -path ./vendor -prune -o -name '*.go' -exec gofmt -l {} + > gofmt-files.txt
          if [ -s gofmt-files.txt ]; then
            echo "The following files are not formatted correctly:"
            cat gofmt-files.txt
            echo ""
            echo "Please run 'pre-commit run gofmt --all-files' to fix formatting."
            exit 1
          fi

      - name: gofmt summary
        if: always()
        run: |
          if [ "${{ steps.gofmt.outcome }}" = "success" ]; then
            {
              echo "Go formatting passed."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "Go formatting failed."
              echo ""
              echo "\`\`\`"
              if [ -s gofmt-files.txt ]; then
                cat gofmt-files.txt
              else
                echo "No files captured."
              fi
              echo "\`\`\`"
              echo "Please run \`pre-commit run gofmt --all-files\` to fix formatting."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
