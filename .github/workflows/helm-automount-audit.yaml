name: Helm Automount Audit

on:
  workflow_call:
    inputs:
      runs-on:
        description: >-
          Runner label. Defaults to ubuntu-latest. Override to a self-hosted
          runner label if you want to run CI on your own scale set.
        required: false
        default: ubuntu-latest
        type: string
      chart-path:
        description: Path to the Helm chart directory
        required: true
        type: string
      template-args:
        description: Arguments passed to helm template (e.g., "-f values.yaml -f values/prod.yaml")
        required: false
        default: ""
        type: string
      release-name:
        description: Release name for helm template
        required: false
        default: "audit"
        type: string
      helm-version:
        description: Helm version used to render the chart
        required: false
        # renovate: github-releases=helm/helm
        default: v4.3.0
        type: string
      yq-version:
        description: yq release to install (linux amd64 binary)
        required: false
        default: v4.52.5
        type: string
      yq-sha256:
        description: >-
          SHA-256 of yq_linux_amd64 for yq-version, from that release's
          `checksums` file (SHA-256 column, see `checksums_hashes_order`).
          Change it together with yq-version.
        required: false
        default: 75d893a0d5940d1019cb7cdc60001d9e876623852c31cfc6267047bc31149fa9
        type: string

permissions:
  contents: read

jobs:
  automount-audit:
    name: pod token automount audit
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ inputs.helm-version }}

      - name: Install yq
        # The download is checked against the SHA-256 its upstream release
        # publishes before it is run, so a swapped or truncated asset fails the
        # job instead of auditing with it. Installs to a user-writable location
        # for self-hosted runners without passwordless sudo.
        shell: bash
        env:
          YQ_VERSION: ${{ inputs.yq-version }}
          YQ_SHA256: ${{ inputs.yq-sha256 }}
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/bin"
          dl="$(mktemp -d -p "$RUNNER_TEMP")"
          mkdir -p "$bin"

          # fetch <tool> <url> <sha256> <file>: download, then verify or fail.
          # <tool> is the prefix of the <tool>-version / <tool>-sha256 inputs,
          # so a mismatch tells the caller which pair to change.
          fetch() {
            local tool="$1" url="$2" want="$3" file="$4" got
            if ! [[ "$want" =~ ^[0-9a-f]{64}$ ]]; then
              echo "::error::${tool}-sha256 must be a 64-character lowercase hex sha256, got '$want'"
              exit 1
            fi
            curl -fsSLo "$file" "$url"
            got="$(sha256sum < "$file")"
            got="${got%% *}"
            if [ "$got" != "$want" ]; then
              echo "::error::${tool} sha256 mismatch for $url: expected $want, got $got. Set the ${tool}-sha256 input together with ${tool}-version."
              exit 1
            fi
          }

          fetch yq "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64" \
            "$YQ_SHA256" "$dl/yq"
          install -m 0755 "$dl/yq" "$bin/yq"
          echo "$bin" >> "$GITHUB_PATH"

      - name: Render chart
        shell: bash
        env:
          RELEASE_NAME: ${{ inputs.release-name }}
          CHART_PATH: ${{ inputs.chart-path }}
          TEMPLATE_ARGS: ${{ inputs.template-args }}
        run: |
          set -euo pipefail
          # template-args has always been shell words (quotes and $VARS
          # included), so it is parsed into an argument list here exactly as
          # it was when the input was pasted into the command line.
          eval "args=($TEMPLATE_ARGS)"
          helm template "$RELEASE_NAME" "$CHART_PATH" "${args[@]}" > "$RUNNER_TEMP/rendered.yaml"

      - name: Audit pod token automount
        shell: bash
        run: |
          set -euo pipefail
          # Covers workload controllers (Deployment/StatefulSet/DaemonSet/Job),
          # ARC runner scale sets (AutoscalingRunnerSet — its pod spec lives at
          # .spec.template.spec, same as a Deployment), bare Pods (whose
          # automount field is at .spec, not .spec.template.spec), and CronJobs
          # (pod spec nested at .spec.jobTemplate.spec.template.spec). Omitting
          # Job/CronJob emits a false all-clear the day a chart adds a migration
          # Job or cleanup CronJob with default token automount.
          # No `|| true`: a yq error (parse failure, expression regression after
          # a yq bump, missing rendered.yaml) must fail the step rather
          # than swallow into an empty result that prints a false all-clear.
          # `yq -N` already exits 0 with no output when nothing matches.
          # shellcheck disable=SC2016
          automounts=$(yq -N \
            'select(.kind == "Deployment" or .kind == "StatefulSet" or .kind == "DaemonSet"
                or .kind == "AutoscalingRunnerSet" or .kind == "Job"
                or .kind == "CronJob" or .kind == "Pod")
            | {"name": .metadata.name,
               "automount": (
                  (select(.kind == "Pod") | .spec.automountServiceAccountToken),
                  (select(.kind == "CronJob") | .spec.jobTemplate.spec.template.spec.automountServiceAccountToken),
                  (select(.kind != "Pod" and .kind != "CronJob") | .spec.template.spec.automountServiceAccountToken)
               )}
            | select(.automount != false)
            | .name' \
            "$RUNNER_TEMP/rendered.yaml" | sort -u)
          {
            echo "### Pod Token Automount Audit"
            if [ -z "$automounts" ]; then
              echo "All workloads explicitly disable automountServiceAccountToken."
            else
              echo "The following workloads mount SA tokens (review whether each is intentional):"
              echo ""
              echo '```'
              echo "$automounts"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
