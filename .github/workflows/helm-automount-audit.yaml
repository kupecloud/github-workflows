name: Helm Automount Audit

on:
  workflow_call:
    inputs:
      runs-on:
        description: >-
          Runner label. Defaults to ubuntu-latest. Override to a self-hosted
          runner label if you want to run CI on your own scale set.
        required: false
        default: ubuntu-latest
        type: string
      chart-path:
        description: Path to the Helm chart directory
        required: true
        type: string
      template-args:
        description: Arguments passed to helm template (e.g., "-f values.yaml -f values/prod.yaml")
        required: false
        default: ""
        type: string
      release-name:
        description: Release name for helm template
        required: false
        default: "audit"
        type: string

permissions:
  contents: read

jobs:
  automount-audit:
    name: pod token automount audit
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Set up Helm
        uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0
        with:
          version: v3.18.6

      - name: Install yq
        # Install to a user-writable location so this works on minimal
        # self-hosted runner images that don't grant passwordless sudo.
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSLo "$HOME/.local/bin/yq" https://github.com/mikefarah/yq/releases/download/v4.52.5/yq_linux_amd64
          chmod +x "$HOME/.local/bin/yq"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Render chart
        shell: bash
        env:
          RELEASE_NAME: ${{ inputs.release-name }}
          CHART_PATH: ${{ inputs.chart-path }}
        run: helm template "$RELEASE_NAME" "$CHART_PATH" ${{ inputs.template-args }} > /tmp/rendered.yaml

      - name: Audit pod token automount
        shell: bash
        run: |
          # Covers workload controllers (Deployment/StatefulSet/DaemonSet/Job),
          # ARC runner scale sets (AutoscalingRunnerSet — its pod spec lives at
          # .spec.template.spec, same as a Deployment), bare Pods (whose
          # automount field is at .spec, not .spec.template.spec), and CronJobs
          # (pod spec nested at .spec.jobTemplate.spec.template.spec). Omitting
          # Job/CronJob emits a false all-clear the day a chart adds a migration
          # Job or cleanup CronJob with default token automount.
          # No `|| true`: a yq error (parse failure, expression regression after
          # a yq bump, missing /tmp/rendered.yaml) must fail the step rather
          # than swallow into an empty result that prints a false all-clear.
          # `yq -N` already exits 0 with no output when nothing matches.
          # shellcheck disable=SC2016
          automounts=$(yq -N \
            'select(.kind == "Deployment" or .kind == "StatefulSet" or .kind == "DaemonSet"
                or .kind == "AutoscalingRunnerSet" or .kind == "Job"
                or .kind == "CronJob" or .kind == "Pod")
            | {"name": .metadata.name,
               "automount": (
                  (select(.kind == "Pod") | .spec.automountServiceAccountToken),
                  (select(.kind == "CronJob") | .spec.jobTemplate.spec.template.spec.automountServiceAccountToken),
                  (select(.kind != "Pod" and .kind != "CronJob") | .spec.template.spec.automountServiceAccountToken)
               )}
            | select(.automount != false)
            | .name' \
            /tmp/rendered.yaml | sort -u)
          {
            echo "### Pod Token Automount Audit"
            if [ -z "$automounts" ]; then
              echo "All workloads explicitly disable automountServiceAccountToken."
            else
              echo "The following workloads mount SA tokens (review whether each is intentional):"
              echo ""
              echo '```'
              echo "$automounts"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
