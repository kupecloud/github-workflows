name: Helm Lint

on:
  workflow_call:
    inputs:
      runs-on:
        description: >-
          Runner label. Defaults to ubuntu-latest. Override to a self-hosted
          runner label if you want to run CI on your own scale set.
        required: false
        default: ubuntu-latest
        type: string
      chart-path:
        description: Path to the Helm chart directory
        required: true
        type: string
      lint-args:
        description: Additional arguments passed to helm lint
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  helm-lint:
    name: helm lint
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.4

      - name: Run helm lint
        id: helm-lint
        shell: bash
        env:
          CHART_PATH: ${{ inputs.chart-path }}
        run: helm lint "$CHART_PATH" ${{ inputs.lint-args }}

      - name: helm lint summary
        if: always()
        run: |
          if [ "${{ steps.helm-lint.outcome }}" = "success" ]; then
            {
              echo "### helm lint"
              echo "Helm lint passed."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### helm lint"
              echo "Helm lint failed."
              echo ""
              echo "- Review the job logs for details."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
