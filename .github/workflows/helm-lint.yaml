name: Helm Lint

on:
  workflow_call:
    inputs:
      runs-on:
        description: >-
          Runner label. Defaults to ubuntu-latest. Override to a self-hosted
          runner label if you want to run CI on your own scale set.
        required: false
        default: ubuntu-latest
        type: string
      chart-path:
        description: Path to the Helm chart directory
        required: true
        type: string
      lint-args:
        description: Additional arguments passed to helm lint
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  helm-lint:
    name: helm lint
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.21.4

      - name: Run helm lint
        id: helm-lint
        shell: bash
        env:
          CHART_PATH: ${{ inputs.chart-path }}
        run: helm lint "$CHART_PATH" ${{ inputs.lint-args }}

      - name: helm lint summary
        if: always()
        run: |
          if [ "${{ steps.helm-lint.outcome }}" = "success" ]; then
            {
              echo "### helm lint"
              echo "Helm lint passed."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### helm lint"
              echo "Helm lint failed."
              echo ""
              echo "- Review the job logs for details."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
