name: Helm RBAC Audit

on:
  workflow_call:
    inputs:
      runs-on:
        description: >-
          Runner label. Defaults to ubuntu-latest. Override to a self-hosted
          runner label if you want to run CI on your own scale set.
        required: false
        default: ubuntu-latest
        type: string
      chart-path:
        description: Path to the Helm chart directory
        required: true
        type: string
      template-args:
        description: Arguments passed to helm template (e.g., "-f values.yaml -f values/prod.yaml")
        required: false
        default: ""
        type: string
      release-name:
        description: Release name for helm template
        required: false
        default: "audit"
        type: string
      helm-version:
        description: Helm version used to render the chart
        required: false
        # renovate: github-releases=helm/helm
        default: v4.3.0
        type: string
      yq-version:
        description: yq release to install (linux amd64 binary)
        required: false
        default: v4.52.5
        type: string
      yq-sha256:
        description: >-
          SHA-256 of yq_linux_amd64 for yq-version, from that release's
          `checksums` file (SHA-256 column, see `checksums_hashes_order`).
          Change it together with yq-version.
        required: false
        default: 75d893a0d5940d1019cb7cdc60001d9e876623852c31cfc6267047bc31149fa9
        type: string

permissions:
  contents: read

jobs:
  rbac-audit:
    name: rbac secrets audit
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ inputs.helm-version }}

      - name: Install yq
        # The download is checked against the SHA-256 its upstream release
        # publishes before it is run, so a swapped or truncated asset fails the
        # job instead of auditing with it. Installs to a user-writable location
        # for self-hosted runners without passwordless sudo.
        shell: bash
        env:
          YQ_VERSION: ${{ inputs.yq-version }}
          YQ_SHA256: ${{ inputs.yq-sha256 }}
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/bin"
          dl="$(mktemp -d -p "$RUNNER_TEMP")"
          mkdir -p "$bin"

          # fetch <url> <sha256> <file>: download, then verify or fail.
          fetch() {
            if ! [[ "$2" =~ ^[0-9a-f]{64}$ ]]; then
              echo "::error::expected a 64-character lowercase hex sha256 for $1, got '$2'"
              exit 1
            fi
            curl -fsSLo "$3" "$1"
            echo "$2  $3" | sha256sum --check --strict -
          }

          fetch "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64" \
            "$YQ_SHA256" "$dl/yq"
          install -m 0755 "$dl/yq" "$bin/yq"
          echo "$bin" >> "$GITHUB_PATH"

      - name: Render chart
        shell: bash
        env:
          RELEASE_NAME: ${{ inputs.release-name }}
          CHART_PATH: ${{ inputs.chart-path }}
          TEMPLATE_ARGS: ${{ inputs.template-args }}
        run: |
          set -euo pipefail
          # template-args has always been shell words (quotes and $VARS
          # included), so it is parsed into an argument list here exactly as
          # it was when the input was pasted into the command line.
          eval "args=($TEMPLATE_ARGS)"
          helm template "$RELEASE_NAME" "$CHART_PATH" "${args[@]}" > "$RUNNER_TEMP/rendered.yaml"

      - name: Audit cluster-wide secrets access
        id: rbac-audit
        shell: bash
        run: |
          set -euo pipefail

          # Detect ClusterRoles whose rules grant access to core secrets.
          # Uses yq -N to suppress null documents and an inline select so
          # the match is evaluated per-document — avoids the cross-document
          # variable leak that the `$n` pattern is susceptible to.
          # Match resources exactly: `contains(["secrets"])` substring-matches
          # (false positives on externalsecrets/secretstores/...) and never
          # matches the wildcard, so `resources: ["*"]` bypassed the gate.
          # yq's `==` glob-matches strings, so the wildcard needs a regex.
          # No `|| true`: this is a blocking security gate, so a yq error
          # (parse failure on an odd rendered doc, an expression regression
          # after a yq bump, a missing rendered.yaml) must FAIL the job,
          # not swallow the error into an empty result that reads as "clean".
          # `yq -N` already emits nothing with exit 0 when no document matches,
          # so the empty case does not need `|| true`.
          # shellcheck disable=SC2016
          offenders=$(yq -N \
            'select(.kind == "ClusterRole")
            | select([.rules[]? | select(.resources != null) | .resources[]
                | select(. == "secrets" or test("^\*$"))] | length > 0)
            | .metadata.name' \
            "$RUNNER_TEMP/rendered.yaml" | sort -u)

          if [ -n "$offenders" ]; then
            echo "::error::Rendered chart contains ClusterRoles with cluster-wide secrets access:"
            echo "$offenders"
            echo ""
            echo "Cluster-wide secrets read is a blast-radius amplifier. Prefer"
            echo "narrowing the rule to specific namespaces (a Role, not a"
            echo "ClusterRole) or to named resources. This gate has no allowlist"
            echo "input; if the cluster-wide grant is genuinely required, document"
            echo "the justification in security_best_practices_report.md."
            exit 1
          fi
          echo "OK: no cluster-wide secrets access in rendered ClusterRoles"

      - name: rbac audit summary
        if: always()
        run: |
          set -euo pipefail
          {
            echo "### RBAC Secrets Audit"
            case "${{ steps.rbac-audit.outcome }}" in
              success)
                echo "No cluster-wide secrets access found in rendered ClusterRoles."
                ;;
              failure)
                echo "**FAILED** — one or more ClusterRoles grant cluster-wide secrets access."
                echo ""
                echo "- Review the job logs for the list of offending ClusterRoles."
                ;;
              *)
                # An earlier step failed (tool install, checksum or render), so
                # the audit never ran. Say so rather than blame the chart.
                echo "**NOT RUN** — an earlier step failed before the audit."
                echo ""
                echo "- Review the job logs for the failing step."
                ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"
