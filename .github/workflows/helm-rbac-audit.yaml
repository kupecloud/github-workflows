name: Helm RBAC Audit

on:
  workflow_call:
    inputs:
      runs-on:
        description: >-
          Runner label. Defaults to ubuntu-latest. Override to a self-hosted
          runner label if you want to run CI on your own scale set.
        required: false
        default: ubuntu-latest
        type: string
      chart-path:
        description: Path to the Helm chart directory
        required: true
        type: string
      template-args:
        description: Arguments passed to helm template (e.g., "-f values.yaml -f values/prod.yaml")
        required: false
        default: ""
        type: string
      release-name:
        description: Release name for helm template
        required: false
        default: "audit"
        type: string

permissions:
  contents: read

jobs:
  rbac-audit:
    name: rbac secrets audit
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.21.4

      - name: Install yq
        # Install to a user-writable location so this works on minimal
        # self-hosted runner images that don't grant passwordless sudo.
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSLo "$HOME/.local/bin/yq" https://github.com/mikefarah/yq/releases/download/v4.52.5/yq_linux_amd64
          chmod +x "$HOME/.local/bin/yq"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Render chart
        shell: bash
        env:
          RELEASE_NAME: ${{ inputs.release-name }}
          CHART_PATH: ${{ inputs.chart-path }}
        run: helm template "$RELEASE_NAME" "$CHART_PATH" ${{ inputs.template-args }} > /tmp/rendered.yaml

      - name: Audit cluster-wide secrets access
        id: rbac-audit
        shell: bash
        run: |
          set -euo pipefail

          # Detect ClusterRoles whose rules grant access to core secrets.
          # Uses yq -N to suppress null documents and an inline select so
          # the match is evaluated per-document — avoids the cross-document
          # variable leak that the `$n` pattern is susceptible to.
          # Match resources exactly: `contains(["secrets"])` substring-matches
          # (false positives on externalsecrets/secretstores/...) and never
          # matches the wildcard, so `resources: ["*"]` bypassed the gate.
          # yq's `==` glob-matches strings, so the wildcard needs a regex.
          # No `|| true`: this is a blocking security gate, so a yq error
          # (parse failure on an odd rendered doc, an expression regression
          # after a yq bump, a missing /tmp/rendered.yaml) must FAIL the job,
          # not swallow the error into an empty result that reads as "clean".
          # `yq -N` already emits nothing with exit 0 when no document matches,
          # so the empty case does not need `|| true`.
          # shellcheck disable=SC2016
          offenders=$(yq -N \
            'select(.kind == "ClusterRole")
            | select([.rules[]? | select(.resources != null) | .resources[]
                | select(. == "secrets" or test("^\*$"))] | length > 0)
            | .metadata.name' \
            /tmp/rendered.yaml | sort -u)

          if [ -n "$offenders" ]; then
            echo "::error::Rendered chart contains ClusterRoles with cluster-wide secrets access:"
            echo "$offenders"
            echo ""
            echo "Cluster-wide secrets read is a blast-radius amplifier. Prefer"
            echo "narrowing the rule to specific namespaces (a Role, not a"
            echo "ClusterRole) or to named resources. This gate has no allowlist"
            echo "input; if the cluster-wide grant is genuinely required, document"
            echo "the justification in security_best_practices_report.md."
            exit 1
          fi
          echo "OK: no cluster-wide secrets access in rendered ClusterRoles"

      - name: rbac audit summary
        if: always()
        run: |
          if [ "${{ steps.rbac-audit.outcome }}" = "success" ]; then
            {
              echo "### RBAC Secrets Audit"
              echo "No cluster-wide secrets access found in rendered ClusterRoles."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### RBAC Secrets Audit"
              echo "**FAILED** — one or more ClusterRoles grant cluster-wide secrets access."
              echo ""
              echo "- Review the job logs for the list of offending ClusterRoles."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
