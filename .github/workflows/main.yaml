name: Main

on:
  push:
    branches:
      - main
    paths:
      - ".github/actions/**"
      - ".github/workflows/**"
      - ".github/semantic-release/**"
      - "README.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    uses: ./.github/workflows/validate.yaml

  release:
    name: Release
    needs:
      - validate
    uses: ./.github/workflows/semantic-release.yaml
    # semantic-release.yaml only creates GitHub releases and pushes file
    # bumps via @semantic-release/git — it publishes no images and does no
    # OIDC, so packages:write / id-token:write are not needed here.
    permissions:
      contents: write
      issues: write
      pull-requests: write
    secrets: inherit
