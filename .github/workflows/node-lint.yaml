name: Node Lint

on:
  workflow_call:
    inputs:
      runs-on:
        description: >-
          Runner label. Defaults to ubuntu-latest. Override to a self-hosted
          runner label if you want to run CI on your own scale set.
        required: false
        default: ubuntu-latest
        type: string
      node-version:
        description: Node.js version to install
        required: false
        default: "22"
        type: string
      working-directory:
        description: Directory containing package.json
        required: false
        default: "."
        type: string
      lint-script:
        description: npm script name for the linter
        required: false
        default: lint
        type: string
      tsc-script:
        description: npm script name for TypeScript type checking
        required: false
        default: tsc
        type: string

permissions:
  contents: read

jobs:
  eslint:
    name: eslint
    runs-on: ${{ inputs.runs-on }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run eslint
        id: eslint
        run: npm run ${{ inputs.lint-script }}

      - name: eslint summary
        if: always()
        run: |
          if [ "${{ steps.eslint.outcome }}" = "success" ]; then
            {
              echo "### eslint"
              echo "Node linting passed."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### eslint"
              echo "Node linting failed."
              echo ""
              echo "- Review the job logs for full details."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  tsc:
    name: tsc
    runs-on: ${{ inputs.runs-on }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tsc
        id: tsc
        run: npm run ${{ inputs.tsc-script }}

      - name: tsc summary
        if: always()
        run: |
          if [ "${{ steps.tsc.outcome }}" = "success" ]; then
            {
              echo "### tsc"
              echo "TypeScript type checking passed."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### tsc"
              echo "TypeScript type checking failed."
              echo ""
              echo "- Review the job logs for full details."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
