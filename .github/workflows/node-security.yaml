name: Node Security

on:
  workflow_call:
    inputs:
      runs-on:
        description: >-
          Runner label. Defaults to ubuntu-latest. Override to a self-hosted
          runner label if you want to run CI on your own scale set.
        required: false
        default: ubuntu-latest
        type: string
      node-version:
        description: Node.js version to install
        required: false
        default: "22"
        type: string
      working-directory:
        description: Directory containing package.json
        required: false
        default: "."
        type: string
      audit-level:
        description: Minimum severity that fails the build (low, moderate, high, critical)
        required: false
        default: high
        type: string
      audit-omit:
        description: Dependency groups to omit from audit (e.g. dev, optional, peer)
        required: false
        default: dev
        type: string

permissions:
  contents: read

jobs:
  npm-audit:
    name: npm audit
    runs-on: ${{ inputs.runs-on }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

      # NOTE: we run npm audit BEFORE installing because `npm audit` works
      # against package-lock.json directly and does not need node_modules.
      # Skipping `npm ci` here saves ~30s of install time on every CI run.
      - name: Run npm audit
        id: audit
        shell: bash
        env:
          AUDIT_LEVEL: ${{ inputs.audit-level }}
          AUDIT_OMIT: ${{ inputs.audit-omit }}
        run: |
          set -euo pipefail
          npm audit --audit-level="$AUDIT_LEVEL" --omit="$AUDIT_OMIT"

      - name: npm audit summary
        if: always()
        shell: bash
        env:
          AUDIT_LEVEL: ${{ inputs.audit-level }}
        run: |
          set -euo pipefail
          if [ "${{ steps.audit.outcome }}" = "success" ]; then
            {
              echo "### npm audit"
              echo "No production dependency vulnerabilities at level \`${AUDIT_LEVEL}\` or above."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### npm audit"
              echo "Production dependency vulnerabilities found at level \`${AUDIT_LEVEL}\` or above."
              echo ""
              echo "- Review the job logs for the full advisory list."
              echo "- Run \`npm audit fix\` locally to apply available patches."
              echo "- For unfixable advisories, document the residual risk and pin the dependency."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
