name: Node Security

on:
  workflow_call:
    inputs:
      runs-on:
        description: >-
          Runner label. Defaults to ubuntu-latest. Override to a self-hosted
          runner label if you want to run CI on your own scale set.
        required: false
        default: ubuntu-latest
        type: string
      node-version:
        description: Node.js version to install
        required: false
        default: "22"
        type: string
      working-directory:
        description: Directory containing package.json
        required: false
        default: "."
        type: string
      audit-level:
        description: Minimum severity that fails the build (low, moderate, high, critical)
        required: false
        default: high
        type: string
      audit-omit:
        description: Dependency groups to omit from audit (e.g. dev, optional, peer)
        required: false
        default: dev
        type: string

permissions:
  contents: read

jobs:
  npm-audit:
    name: npm audit
    runs-on: ${{ inputs.runs-on }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

      # NOTE: we run npm audit BEFORE installing because `npm audit` works
      # against package-lock.json directly and does not need node_modules.
      # Skipping `npm ci` here saves ~30s of install time on every CI run.
      - name: Run npm audit
        id: audit
        shell: bash
        run: |
          set +e
          npm audit --audit-level=${{ inputs.audit-level }} --omit=${{ inputs.audit-omit }}
          EXIT_CODE=$?
          set -e
          exit $EXIT_CODE

      - name: npm audit summary
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.audit.outcome }}" = "success" ]; then
            {
              echo "### npm audit"
              echo "No production dependency vulnerabilities at level \`${{ inputs.audit-level }}\` or above."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### npm audit"
              echo "Production dependency vulnerabilities found at level \`${{ inputs.audit-level }}\` or above."
              echo ""
              echo "- Review the job logs for the full advisory list."
              echo "- Run \`npm audit fix\` locally to apply available patches."
              echo "- For unfixable advisories, document the residual risk and pin the dependency."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
