name: Packer Build

on:
  workflow_call:
    inputs:
      runs-on:
        description: >-
          Runner label. Defaults to ubuntu-latest. Override to a self-hosted
          runner label if you want to run CI on your own scale set.
        required: false
        default: ubuntu-latest
        type: string
      semantic_version:
        description: Semantic version to tag the snapshot
        required: false
        type: string
      env:
        description: Environment name to tag the snapshot (dev, prod, ...). Forwarded to Packer as -var env=<value>.
        required: false
        type: string
      packer_dir:
        description: Path to the directory containing the Packer config
        required: false
        type: string
        default: ./packer
      packer_version:
        description: Packer CLI version to install
        required: false
        type: string
        default: 1.14.3
      provider_env_var:
        description: Name of the env var the Packer provider expects for its API token (e.g. HCLOUD_TOKEN, DIGITALOCEAN_TOKEN).
        required: true
        type: string
      extra_vars:
        description: Additional Packer variables as newline-delimited KEY=VALUE pairs. Values are forwarded verbatim via -var.
        required: false
        type: string
        default: ""
      force:
        description: Pass -force to packer build so existing artifacts are overwritten instead of failing. Safe when the provider's artifact is not live-referenced after creation (e.g. Hetzner snapshots).
        required: false
        type: boolean
        default: false
      only:
        description: Forwarded to packer as -only=<value> to restrict the build to a subset of sources (e.g. "hcloud.microos-x86"). Leave empty to build every source defined in the packer config.
        required: false
        type: string
        default: ""
    secrets:
      provider_token:
        description: Provider API token exposed as the env var named by provider_env_var.
        required: true

permissions:
  contents: read

jobs:
  packer-build:
    name: Packer Build
    runs-on: ${{ inputs.runs-on }}
    # Opt into Node 24 so hashicorp/setup-packer (still on node20 at v3.2.0)
    # does not emit the deprecation warning on every run. GitHub forces Node 24
    # for all JS actions from 2026-06-02; this drop-out is removable then.
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Packer
        uses: hashicorp/setup-packer@ce93c3c08a6c2ff2275bf4b54ff0d9a75f6c9789 # v3.4.0
        with:
          version: ${{ inputs.packer_version }}

      - name: Export provider credentials
        env:
          PROVIDER_ENV_VAR: ${{ inputs.provider_env_var }}
          PROVIDER_TOKEN: ${{ secrets.provider_token }}
        run: |
          # Randomized heredoc delimiter per GitHub's own guidance, so a token
          # value can never smuggle a matching terminator line into GITHUB_ENV.
          DELIM="PROVIDER_TOKEN_EOF_$(openssl rand -hex 16)"
          {
            echo "${PROVIDER_ENV_VAR}<<${DELIM}"
            printf '%s\n' "$PROVIDER_TOKEN"
            echo "${DELIM}"
          } >> "$GITHUB_ENV"

      - name: Packer init
        env:
          PACKER_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: packer init ${{ inputs.packer_dir }}

      - name: Packer validate
        run: packer validate ${{ inputs.packer_dir }}

      - name: Packer build
        env:
          PACKER_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXTRA_VARS: ${{ inputs.extra_vars }}
          FORCE: ${{ inputs.force }}
          ONLY: ${{ inputs.only }}
          SEMVER: ${{ inputs.semantic_version }}
          ENV_NAME: ${{ inputs.env }}
        run: |
          args=()
          if [ "$FORCE" = "true" ]; then
            args+=(-force)
          fi
          if [ -n "$ONLY" ]; then
            args+=("-only=$ONLY")
          fi
          if [ -n "$SEMVER" ]; then
            args+=(-var "semantic_version=$SEMVER")
          fi
          if [ -n "$ENV_NAME" ]; then
            args+=(-var "env=$ENV_NAME")
          fi
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            args+=(-var "$line")
          done <<< "$EXTRA_VARS"
          packer build "${args[@]}" ${{ inputs.packer_dir }}
