name: Packer Validate

on:
  workflow_call:
    inputs:
      runs-on:
        description: >-
          Runner label. Defaults to ubuntu-latest. Override to a self-hosted
          runner label if you want to run CI on your own scale set.
        required: false
        default: ubuntu-latest
        type: string
      packer_dir:
        description: Path to the directory containing the Packer config
        required: false
        type: string
        default: ./packer
      packer_version:
        description: Packer CLI version to install
        required: false
        type: string
        default: 1.14.3
      validate_vars:
        description: >-
          Packer variables passed to `packer validate`, as newline-delimited
          KEY=VALUE pairs (each forwarded verbatim via -var). Defaults to the
          hcloud dummy token so existing hcloud consumers are unchanged;
          override for configs that declare a differently named provider token
          variable, or set to an empty string for configs with no required vars.
        required: false
        type: string
        default: hcloud_token=validation-dummy

permissions:
  contents: read

jobs:
  packer-validate:
    name: Packer Validate
    runs-on: ${{ inputs.runs-on }}
    # Opt into Node 24 so hashicorp/setup-packer (still on node20 at v3.2.0)
    # does not emit the deprecation warning on every run. GitHub forces Node 24
    # for all JS actions from 2026-06-02; this drop-out is removable then.
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Packer
        uses: hashicorp/setup-packer@ce93c3c08a6c2ff2275bf4b54ff0d9a75f6c9789 # v3.4.0
        with:
          version: ${{ inputs.packer_version }}

      - name: Packer init
        env:
          PACKER_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKER_DIR: ${{ inputs.packer_dir }}
        run: packer init "$PACKER_DIR"

      - name: Packer fmt
        env:
          PACKER_DIR: ${{ inputs.packer_dir }}
        run: packer fmt -check -diff "$PACKER_DIR"

      - name: Packer validate
        env:
          VALIDATE_VARS: ${{ inputs.validate_vars }}
          PACKER_DIR: ${{ inputs.packer_dir }}
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            args+=(-var "$line")
          done <<< "$VALIDATE_VARS"
          packer validate "${args[@]}" "$PACKER_DIR"
