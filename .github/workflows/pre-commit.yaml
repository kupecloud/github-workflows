name: Pre-Commit

on:
  workflow_call:
    inputs:
      runs-on:
        description: >-
          Runner label. Defaults to ubuntu-latest. Override to a self-hosted
          runner label if you want to run CI on your own scale set.
        required: false
        default: ubuntu-latest
        type: string
      python-version:
        description: Python version used to install pre-commit
        required: false
        default: "3.13"
        type: string
      go-version:
        description: Go version to install for system pre-commit hooks
        required: false
        default: ""
        type: string
      go-version-file:
        description: Path to a go.mod file used to resolve the Go version
        required: false
        default: ""
        type: string
      node-version:
        description: Node.js version to install for system pre-commit hooks
        required: false
        default: ""
        type: string
      install-npm-deps:
        description: Run npm ci before pre-commit (requires node-version to be set)
        required: false
        default: false
        type: boolean
      working-directory:
        description: Directory containing package.json (used when install-npm-deps is true)
        required: false
        default: "."
        type: string
      install-helm:
        description: Whether Helm should be installed for pre-commit hooks
        required: false
        default: false
        type: boolean
      helm-version:
        description: Helm version to install when install-helm is enabled
        required: false
        default: "v3.18.6"
        type: string
      args:
        description: Arguments passed to pre-commit run
        required: false
        default: "--all-files"
        type: string

permissions:
  contents: read

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ inputs.python-version }}

      - name: Set up Go from go.mod
        if: inputs.go-version-file != ''
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: ${{ inputs.go-version-file }}

      - name: Set up Go
        if: inputs.go-version-file == '' && inputs.go-version != ''
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ inputs.go-version }}

      - name: Set up Node
        if: inputs.node-version != ''
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.install-npm-deps && format('{0}/package-lock.json', inputs.working-directory) || '' }}

      - name: Install npm dependencies
        if: inputs.install-npm-deps
        working-directory: ${{ inputs.working-directory }}
        run: npm ci

      - name: Set up Helm
        if: inputs.install-helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ inputs.helm-version }}

      - name: Install pre-commit
        run: python -m pip install pre-commit==4.2.0

      - name: Run pre-commit
        id: pre-commit
        shell: bash
        run: pre-commit run ${{ inputs.args }}

      - name: pre-commit summary
        if: always()
        run: |
          if [ "${{ steps.pre-commit.outcome }}" = "success" ]; then
            {
              echo "### pre-commit"
              echo "pre-commit passed."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### pre-commit"
              echo "pre-commit failed."
              echo ""
              echo "- Review the job logs for details."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
