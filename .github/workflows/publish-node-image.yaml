name: Publish Node Image

# For Node.js projects that need npm build before Docker (e.g., Headlamp plugins).
# Runs npm ci + npm run build, then builds and pushes the Docker image with cosign signing.

on:
  workflow_call:
    inputs:
      runs-on:
        description: >-
          Runner label. Defaults to ubuntu-latest. Override to a self-hosted
          runner label if you want to run CI on your own scale set.
        required: false
        default: ubuntu-latest
        type: string
      version:
        description: Semantic release version without the leading v
        required: true
        type: string
      node-version:
        description: Node.js version
        required: false
        type: string
        default: "22"
      build-script:
        description: npm script to run before Docker build
        required: false
        type: string
        default: build
      platforms:
        description: Target platforms for Docker buildx
        required: false
        type: string
        default: linux/amd64,linux/arm64
      dockerfile:
        description: Path to Dockerfile
        required: false
        type: string
        default: ./Dockerfile
      context:
        description: Docker build context path
        required: false
        type: string
        default: .
      build-args:
        description: Docker build arguments (newline-separated KEY=VALUE)
        required: false
        type: string
        default: ""

permissions:
  contents: read
  packages: write
  id-token: write # Required for cosign keyless signing via OIDC

jobs:
  publish:
    name: Build, Push & Sign
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run ${{ inputs.build-script }}

      - name: Install cosign
        uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003 # v4.1.1
        with:
          # Pin the cosign BINARY, not just the action.
          #
          # cosign-installer bakes its default cosign version into each action
          # release (v4.1.1 defaults to v3.0.5), so bumping the action silently
          # changes the tool's MAJOR version — and cosign v3 flipped the
          # defaults of both flags the sign step below depends on. Declaring the
          # version here makes that a reviewable input instead of a side effect,
          # and lets renovate track the two independently.
          cosign-release: v3.0.5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-
            type=raw,value=${{ inputs.version }}
            type=raw,value=v${{ inputs.version }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: true
          platforms: ${{ inputs.platforms }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ inputs.build-args }}

      - name: Sign image with cosign
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          # --new-bundle-format=false: sign with the legacy tag-based .sig
          # format, NOT the sigstore bundle. GHCR does not serve the OCI
          # referrers API (404 MANIFEST_UNKNOWN even when the fallback tag
          # exists — verified live 2026-08-21) and kyverno's SigstoreBundle
          # discovery has no tag fallback, so bundle-signed images are
          # unverifiable by the platform policy. Legacy .sig is what
          # verify-platform-images (type: Cosign) verifies. Revisit when
          # kyverno's GHCR bundle discovery works end-to-end.
          #
          # BOTH flags are required, and passing only the first is a hard error
          # on cosign v3:
          #
          #   must provide --new-bundle-format or --bundle where applicable
          #   with --signing-config or --use-signing-config
          #
          # cosign v3 defaults BOTH --new-bundle-format and --use-signing-config
          # to true, and the latter refuses to run without the former, so the
          # legacy format needs the signing-config opt-out as well. Both flags
          # also exist on cosign v2 (where both already default to false), so
          # this command is correct on either major — which is what makes a
          # future cosign bump safe rather than silently format-changing.
          #
          # Do not "simplify" this back to a bare `cosign sign --yes`: on
          # cosign v3 that SUCCEEDS and emits a new-format bundle, so CI stays
          # green while the platform policy can no longer verify the image.
          cosign sign --yes --new-bundle-format=false --use-signing-config=false \
            "ghcr.io/${{ github.repository }}@${DIGEST}"
