name: Semantic Release Preview

on:
  workflow_call:
    inputs:
      runs-on:
        description: >-
          Runner label. Defaults to ubuntu-latest. Override to a self-hosted
          runner label if you want to run CI on your own scale set.
        required: false
        default: ubuntu-latest
        type: string
    outputs:
      new_release_published:
        description: Whether a new release would be published
        value: ${{ jobs.preview.outputs.new_release_published }}
      new_release_version:
        description: Next release version
        value: ${{ jobs.preview.outputs.new_release_version }}

# Dry-run only: computes the next version and publishes nothing
# (dry_run: true, persist-credentials: false). Read-only is sufficient.
permissions:
  contents: read

jobs:
  preview:
    name: Semantic Release Preview
    runs-on: ${{ inputs.runs-on }}
    outputs:
      new_release_published: ${{ steps.preview.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # semantic-release-action invokes `npm ci` to install the tool +
      # plugins. Minimal self-hosted runner images don't ship Node, so
      # without this step npm fails with "/bin/sh: 1: npm: not found" —
      # and because the action swallows that error, the preview returns
      # new_release_published=false silently, blocking the downstream
      # release job. Mirrors the same setup in semantic-release.yaml.
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v6.0.0
        with:
          node-version: "22"

      - name: Prepare default semantic-release config
        shell: bash
        env:
          # job_workflow_sha is only a context property, NOT a default env var
          # (GITHUB_JOB_WORKFLOW_SHA does not exist), so it must be injected here
          # to pin the shared default config to this reusable workflow's commit
          # instead of the mutable `main` branch. Mirrors go-lint.yaml.
          JOB_WORKFLOW_SHA: ${{ github.job_workflow_sha }}
        run: |
          if [ -f .releaserc.json ]; then
            echo "Using repository .releaserc.json"
            exit 0
          fi

          # Fetch the shared default config (releaserc-default.json) pinned to
          # the exact commit of *this* reusable workflow, so preview and release
          # always resolve byte-identical config instead of two inline copies
          # that can silently drift. github.workflow_sha must NOT be used — in a
          # reusable workflow the github context is the *caller's*, so it holds
          # the consumer repo's commit, which does not exist under
          # kupecloud/github-workflows and would 404. Falls back to main only if
          # JOB_WORKFLOW_SHA is unset.
          CONFIG_REF="${JOB_WORKFLOW_SHA:-main}"
          CONFIG_URL="https://raw.githubusercontent.com/kupecloud/github-workflows/${CONFIG_REF}/releaserc-default.json"
          echo "No repository .releaserc.json — downloading shared default from ${CONFIG_REF}"
          curl -sSfL "$CONFIG_URL" -o .releaserc.json

      - name: Semantic Release Preview
        id: semantic
        uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 # v6.0.0
        with:
          dry_run: true
          semantic_version: 24
          # Mirror semantic-release.yaml exactly. semantic-release loads every
          # plugin named in `.releaserc.json` at startup — including in
          # dry-run — so a repo whose config references @semantic-release/exec
          # or @semantic-release/git (crds, kupe-api, observability, vcluster,
          # kupe-control-operator, ...) fails the preview with "Cannot find
          # module" unless those plugins are installed here too.
          extra_plugins: |
            conventional-changelog-conventionalcommits
            @semantic-release/exec
            @semantic-release/git
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine release preview result
        id: preview
        shell: bash
        run: |
          if [ -n "${{ steps.semantic.outputs.new_release_version }}" ]; then
            echo "new_release_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "new_release_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Preview info
        if: steps.preview.outputs.new_release_published == 'true'
        run: |
          echo "Next release would be: v${{ steps.semantic.outputs.new_release_version }}"
