name: Semantic Release

on:
  workflow_call:
    inputs:
      runs-on:
        description: >-
          Runner label. Default ubuntu-latest keeps the workflow public/external-safe.
          Internal callers can pass kupe-small | kupe-medium | kupe-large to target
          the self-hosted runner scale sets from the kupe/github-runners chart.
        required: false
        default: ubuntu-latest
        type: string
    outputs:
      new_release_published:
        description: Whether a new release was published
        value: ${{ jobs.release.outputs.new_release_published }}
      new_release_version:
        description: New release version
        value: ${{ jobs.release.outputs.new_release_version }}

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: Semantic Release
    runs-on: ${{ inputs.runs-on }}
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0
          # `persist-credentials: true` puts GITHUB_TOKEN in the git
          # remote URL so semantic-release plugins (notably
          # @semantic-release/git) can push the post-release file bumps
          # back to main. Pushes from GITHUB_TOKEN don't trigger CI,
          # which is exactly what we want for `chore(release): ... [skip ci]`
          # commits — they'd otherwise loop into the next release run.
          persist-credentials: true

      # semantic-release is a Node tool — the cycjimmy action below runs
      # `npm ci` to install it and its plugins. Cloud-hosted runners
      # (ubuntu-latest) ship Node pre-installed, but the minimal
      # actions-runner image used by self-hosted scale sets does not, so
      # the action would otherwise fail with `/bin/sh: 1: npm: not found`
      # and silently skip the release. setup-node makes this work
      # uniformly across both runner types.
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v6.0.0
        with:
          node-version: "22"

      - name: Prepare default semantic-release config
        shell: bash
        run: |
          if [ -f .releaserc.json ]; then
            echo "Using repository .releaserc.json"
            exit 0
          fi

          cat > .releaserc.json <<'JSON'
          {
            "branches": ["main"],
            "plugins": [
              [
                "@semantic-release/commit-analyzer",
                {
                  "preset": "conventionalcommits",
                  "parserOpts": {
                    "noteKeywords": ["BREAKING CHANGE", "BREAKING CHANGES", "BREAKING"]
                  },
                  "releaseRules": [
                    { "type": "feat", "release": "minor" },
                    { "type": "fix", "release": "patch" },
                    { "type": "perf", "release": "patch" },
                    { "type": "refactor", "release": "patch" },
                    { "type": "docs", "release": false },
                    { "type": "style", "release": false },
                    { "type": "chore", "release": false },
                    { "type": "test", "release": false },
                    { "type": "ci", "release": false },
                    { "breaking": true, "release": "major" }
                  ]
                }
              ],
              [
                "@semantic-release/release-notes-generator",
                {
                  "preset": "conventionalcommits",
                  "parserOpts": {
                    "noteKeywords": ["BREAKING CHANGE", "BREAKING CHANGES", "BREAKING"]
                  },
                  "presetConfig": {
                    "types": [
                      { "type": "feat", "section": "Features" },
                      { "type": "fix", "section": "Bug Fixes" },
                      { "type": "perf", "section": "Performance Improvements" },
                      { "type": "refactor", "section": "Code Refactoring" },
                      { "type": "docs", "section": "Documentation", "hidden": true },
                      { "type": "style", "section": "Styles", "hidden": true },
                      { "type": "chore", "section": "Miscellaneous", "hidden": true },
                      { "type": "test", "section": "Tests", "hidden": true },
                      { "type": "ci", "section": "CI/CD", "hidden": true }
                    ]
                  }
                }
              ],
              "@semantic-release/github"
            ]
          }
          JSON

      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 # v6.0.0
        with:
          semantic_version: 24
          # @semantic-release/exec + @semantic-release/git are pre-installed
          # so per-repo `.releaserc.json` can use them to bump in-repo files
          # (e.g. chart/Chart.yaml appVersion) and commit the bump back to
          # the release tag. Repos that don't reference these plugins are
          # unaffected — the install is harmless.
          extra_plugins: |
            conventional-changelog-conventionalcommits
            @semantic-release/exec
            @semantic-release/git
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release info
        if: steps.semantic.outputs.new_release_published == 'true'
        run: |
          echo "New release published: v${{ steps.semantic.outputs.new_release_version }}"
